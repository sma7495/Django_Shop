<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .product-card {
            transition: transform 0.3s, box-shadow 0.3s;
            height: 100%;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .product-img-container {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            background: #f8f9fa;
        }
        .product-img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
        }
        .discount-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #dc3545;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.9rem;
        }
        .loading-spinner {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
        }
        .price-display {
            font-weight: bold;
        }
        .original-price {
            text-decoration: line-through;
            color: #6c757d;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <h1 class="text-center mb-5">Our Products</h1>
        
        <!-- Search and Filter Section -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="input-group">
                    <input type="text" id="searchInput" class="form-control" placeholder="Search products...">
                    <button class="btn btn-primary" id="searchBtn">Search</button>
                </div>
            </div>
            <div class="col-md-6">
                <select id="sortSelect" class="form-select">
                    <option value="newest">Newest First</option>
                    <option value="price_asc">Price: Low to High</option>
                    <option value="price_desc">Price: High to Low</option>
                    <option value="discount">Best Discount</option>
                </select>
            </div>
        </div>
        
        <!-- Products Container -->
        <div id="productsContainer" class="row">
            <!-- Products will be loaded here -->
        </div>
        
        <!-- Pagination -->
        <nav class="mt-5">
            <ul class="pagination justify-content-center" id="pagination">
                <!-- Pagination will be loaded here -->
            </ul>
        </nav>
        
        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="loading-spinner">
            <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </div>

    <!-- jQuery and Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
    $(document).ready(function() {
        const apiUrl = '/products/api/v1/list/';
        let currentPage = 1;
        const productsPerPage =10;
        let currentSearch = '';
        let currentSort = 'newest';
        
        // Initial load
        loadProducts();
        
        // Search handler
        $('#searchBtn').click(function() {
            currentSearch = $('#searchInput').val();
            currentPage = 1;
            loadProducts();
        });
        
        // Sort handler
        $('#sortSelect').change(function() {
            currentSort = $(this).val();
            currentPage = 1;
            loadProducts();
        });
        
        // Load products from API
        function loadProducts() {
            showLoading();
            
            let params = {
                page: currentPage,
                page_size: productsPerPage
            };
            
            // Add search parameter if exists
            if (currentSearch) {
                params.search = currentSearch;
            }
            
            // Add sorting
            switch(currentSort) {
                case 'price_asc':
                    params.ordering = 'price';
                    break;
                case 'price_desc':
                    params.ordering = '-price';
                    break;
                case 'discount':
                    params.ordering = '-discount_percent';
                    break;
                default:
                    params.ordering = '-created_date';
            }
            
            $.ajax({
                url: apiUrl,
                method: 'GET',
                data: params,
                success: function(response) {
                    renderProducts(response.results);
                    renderPagination(response.count);
                    hideLoading();
                },
                error: function(xhr) {
                    console.error('Error loading products');
                    $('#productsContainer').html(`
                        <div class="col-12 text-center py-5">
                            <i class="fas fa-exclamation-triangle fa-3x text-danger mb-3"></i>
                            <h4>Error loading products. Please try again.</h4>
                        </div>
                    `);
                    hideLoading();
                }
            });
        }
        
        // Render products
        function renderProducts(products) {
            const container = $('#productsContainer');
            container.empty();
            
            if (products.length === 0) {
                container.html(`
                    <div class="col-12 text-center py-5">
                        <i class="fas fa-box-open fa-3x text-muted mb-3"></i>
                        <h4>No products found</h4>
                    </div>
                `);
                return;
            }
            
            products.forEach(product => {
                const hasDiscount = product.discount_percent > 0;
                const discountedPrice = hasDiscount ? product.discounted_price : product.price;
                
                const productCard = `
                <div class="col-md-4 col-lg-3 mb-4">
                    <div class="card product-card h-100">
                        ${hasDiscount ? `<span class="discount-badge">-${product.discount_percent}%</span>` : ''}
                        <div class="product-img-container">
                            <img src="${product.image_url || '/static/images/default-product.png'}" 
                                 class="product-img" 
                                 alt="${product.title_en}">
                        </div>
                        <div class="card-body">
                            <h5 class="card-title">${product.title_en}</h5>
                            <p class="card-text text-muted">${product.brief_description.substring(0, 60)}...</p>
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    ${hasDiscount ? `
                                        <span class="original-price">$${product.price}</span>
                                        <span class="price-display text-danger">$${discountedPrice}</span>
                                    ` : `
                                        <span class="price-display">$${product.price}</span>
                                    `}
                                </div>
                                <button class="btn btn-sm btn-outline-primary view-details" 
                                        data-product-id="${product.id}">
                                    View Details
                                </button>
                            </div>
                        </div>
                    </div>
                </div>`;
                
                container.append(productCard);
            });
        }
        
        // Render pagination
        function renderPagination(totalItems) {
            const pagination = $('#pagination');
            pagination.empty();
            
            const totalPages = Math.ceil(totalItems / productsPerPage);
            
            if (totalPages <= 1) return;
            
            // Previous button
            pagination.append(`
                <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
                    <a class="page-link" href="#" data-page="${currentPage - 1}">
                        <i class="fas fa-chevron-left"></i>
                    </a>
                </li>
            `);
            
            // Page numbers
            for (let i = 1; i <= totalPages; i++) {
                pagination.append(`
                    <li class="page-item ${i === currentPage ? 'active' : ''}">
                        <a class="page-link" href="#" data-page="${i}">${i}</a>
                    </li>
                `);
            }
            
            // Next button
            pagination.append(`
                <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
                    <a class="page-link" href="#" data-page="${currentPage + 1}">
                        <i class="fas fa-chevron-right"></i>
                    </a>
                </li>
            `);
            
            // Add click handlers
            $('.page-link').click(function(e) {
                e.preventDefault();
                const page = $(this).data('page');
                if (page && page !== currentPage) {
                    currentPage = page;
                    loadProducts();
                    $('html, body').animate({ scrollTop: 0 }, 'fast');
                }
            });
        }
        
        // Loading state
        function showLoading() {
            $('#loadingSpinner').show();
        }
        
        function hideLoading() {
            $('#loadingSpinner').hide();
        }
    });
    </script>
</body>
</html>
